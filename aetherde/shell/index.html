<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AetherDE</title>
  <link rel="stylesheet" href="/vendor/xterm/xterm.css">
  <link rel="stylesheet" href="/css/shell.css">
</head>
<body>
  <div id="desktop">
    <header id="topbar">
      <div class="tb-group tb-left">
        <button id="btn-launcher" class="tb-button brand" title="Applications" aria-label="Applications">&#9670;</button>
        <div id="workspaces" class="workspaces" role="tablist" aria-label="Workspaces"></div>
      </div>
      <div class="tb-group tb-center">
        <span class="tb-title">AetherDE</span>
      </div>
      <div class="tb-group tb-right">
        <div class="spark-chip" title="CPU usage">
          <canvas id="spark-cpu" width="72" height="20"></canvas><span id="cpu-label">0%</span>
        </div>
        <div class="spark-chip" title="Memory usage">
          <canvas id="spark-ram" width="72" height="20"></canvas><span id="ram-label">0%</span>
        </div>
        <button id="btn-network" class="tb-button" title="Network">&#8645;</button>
        <button id="btn-volume" class="tb-button" title="Sound">&#9834;</button>
        <button id="btn-notifications" class="tb-button" title="Notifications">
          &#128276;<span id="notif-badge" class="badge hidden">0</span>
        </button>
        <button id="btn-clock" class="tb-button clock" title="Quick settings">
          <span id="clock">--:--</span>
        </button>
      </div>
    </header>

    <main id="workspace">
      <div id="wallpaper"></div>
      <div id="desktop-hint">Right-click-free desktop &mdash; use the launcher or dock</div>
    </main>

    <nav id="dock" aria-label="Running applications"></nav>

    <section id="launcher" class="overlay hidden" aria-label="Application launcher">
      <div class="launcher-panel">
        <div class="launcher-head">
          <input id="app-search" type="search" placeholder="Search applications&hellip;" autocomplete="off" spellcheck="false">
          <button id="launcher-close" class="icon-button" aria-label="Close launcher">&#10005;</button>
        </div>
        <div id="app-categories" class="app-categories"></div>
        <div id="app-grid" class="app-grid"></div>
      </div>
    </section>

    <aside id="notification-center" class="drawer right hidden" aria-label="Notification center">
      <header class="drawer-head">
        <h2>Notifications</h2>
        <button id="notif-clear" class="icon-button" aria-label="Clear notifications">Clear all</button>
      </header>
      <div id="notif-list" class="drawer-body"></div>
    </aside>

    <aside id="quick-settings" class="drawer right hidden" aria-label="Quick settings">
      <header class="drawer-head"><h2>Quick settings</h2></header>
      <div class="drawer-body qs-body">
        <div class="qs-card">
          <div class="qs-card-title">Volume <span id="qs-volume-value">0%</span></div>
          <input id="qs-volume" class="range" type="range" min="0" max="100" value="0">
          <button id="qs-mute" class="wide-button">Toggle mute</button>
        </div>
        <div class="qs-card">
          <div class="qs-card-title">Network</div>
          <div id="qs-network" class="qs-line">Checking&hellip;</div>
        </div>
        <div class="qs-card">
          <div class="qs-card-title">System</div>
          <div class="qs-meter"><span>CPU</span><div class="meter"><i id="qs-cpu-bar"></i></div><b id="qs-cpu-text">0%</b></div>
          <div class="qs-meter"><span>RAM</span><div class="meter"><i id="qs-ram-bar"></i></div><b id="qs-ram-text">0%</b></div>
          <div id="qs-load" class="qs-line">Load 0.00</div>
        </div>
        <button id="qs-terminal" class="wide-button primary">Open terminal</button>
      </div>
    </aside>

    <section id="terminal-window" class="floating hidden" aria-label="Terminal">
      <header id="terminal-titlebar">
        <span>&#9655; Aether Terminal</span>
        <span class="window-actions">
          <button id="term-min" aria-label="Minimize terminal">&#8722;</button>
          <button id="term-close" aria-label="Close terminal">&#10005;</button>
        </span>
      </header>
      <div id="terminal-body"></div>
    </section>

    <div id="toast-stack" aria-live="polite"></div>
  </div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
