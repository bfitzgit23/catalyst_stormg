name: Build StormG Linux ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Large Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: false

      - name: Hard Patch Mount Routine
        run: |
          python3 -c "
          with open('autocatalyst.sh', 'r') as f:
              lines = f.readlines()
          
          out = []
          skip = False
          for line in lines:
              # Dynamically find the live session check block, regardless of indentation
              if 'enlarging tmpfs' in line or 'Live session detected' in line:
                  skip = True
                  out.append('    echo \"[*] Container build context: skipping host tmpfs expansion\"\n')
                  continue
              # Comment out any active remount instructions found inside this context
              if skip and 'mount -o remount' in line:
                  out.append(f'    # {line.lstrip()}')
                  continue
              if skip and line.strip() == 'fi':
                  skip = False
                  out.append(line)
                  continue
              out.append(line)
              
          with open('autocatalyst.sh', 'w') as f:
              f.writelines(out)
          "
          echo "=== VERIFYING PATCHED SCRIPT ==="
          cat autocatalyst.sh | grep -A 5 -B 2 "Container build context"

      - name: Run Build in Privileged Gentoo Container
        run: |
          git config --global --add safe.directory "$PWD"
          
          docker run --privileged \
            -v "$PWD":/build-stormg \
            -e REPO_DIR=/build-stormg \
            -w /build-stormg \
            gentoo/stage3:amd64-openrc \
            bash -c "emerge --sync && emerge --oneshot dev-vcs/git && git config --global --add safe.directory /build-stormg && ./autocatalyst.sh"

      - name: Upload Finished ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormG-Xfce-ISO
          path: build/StormG_xfce_*.iso
          if-no-files-found: error
