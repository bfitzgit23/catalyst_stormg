name: Build StormG Linux ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Large Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: false

      - name: Run Build in Privileged Gentoo Container
        run: |
          # 1. Standardize access safety checks inside the host runner environment
          git config --global --add safe.directory "$PWD"
          
          # 2. Fire up the container, sync Portage, install git, patch the mount lines, and build
          docker run --privileged \
            -v "$PWD":/build-stormg \
            -e REPO_DIR=/build-stormg \
            -w /build-stormg \
            gentoo/stage3:amd64-openrc \
            bash -c "emerge --sync && emerge --oneshot dev-vcs/git && git config --global --add safe.directory /build-stormg && sed -i 's/mount -o remount/# mount -o remount/g' ./autocatalyst.sh && ./autocatalyst.sh"

      - name: Upload Finished ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormG-Xfce-ISO
          path: build/StormG_xfce_*.iso
          if-no-files-found: error
