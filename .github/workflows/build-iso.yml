name: Build StormG Linux ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label (a full ISO usually needs more than a hosted runner)"
        type: string
        default: "ubuntu-latest"
      timeout_minutes:
        description: "Job timeout in minutes (GitHub-hosted runners cap at 360)"
        type: string
        default: "360"
      catalyst_args:
        description: "Extra autocatalyst.sh arguments (e.g. --only stage2)"
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '360') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Large Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Restore Resumable Build Data
        uses: actions/cache@v4
        with:
          # The synced portage tree, distfiles, catalyst's storedir/chroots and
          # any already-bumped stage3. A failed run resumes from these instead
          # of rebuilding for hours; a fresh key each run keeps saving them.
          path: .stormg-data
          key: stormg-resume-${{ github.run_id }}
          restore-keys: |
            stormg-resume-

      - name: Run Build in Privileged Gentoo Container
        env:
          CATALYST_ARGS: ${{ inputs.catalyst_args }}
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir -p .stormg-data

          # The script syncs its own portage tree (emerge --sync, falling back
          # to emerge-webrsync) and installs git/catalyst itself, so a bare
          # stage3 image is enough. DATA_DIR is on the runner's own disk (fast)
          # and cached between runs, which is what makes a re-run resume.
          docker run --rm --privileged \
            -v "$PWD":/build-stormg \
            -v "$PWD/.stormg-data":/var/tmp/stormg-data \
            -e REPO_DIR=/build-stormg \
            -e DATA_DIR=/var/tmp/stormg-data \
            -w /build-stormg \
            gentoo/stage3:amd64-openrc \
            bash ./autocatalyst.sh $CATALYST_ARGS

      - name: Upload Finished ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormG-Xfce-ISO
          path: build/StormG_xfce_*.iso
          if-no-files-found: error
