# Calamares partition configuration for Gentoo Linux with ZFS/Btrfs support
---
defaultFileSystemType:  "ext4"
efiSystemPartition:     "/boot/efi"
userSwapChoices:
    - none      # Create no swap (default for this configuration)
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - reuse     # Re-use existing swap
    - file      # To swap file instead of partition

efiSystemPartitionSize: 512MiB
initialPartitioningChoice: none
initialSwapChoice: none  # Changed to none as requested
defaultPartitionTableType: gpt

partitioning:
    - name: "root"
      filesystem: ext4
      mountPoint: "/"
      size: 100%
      minSize: 10GiB
      maxSize: 100%
      features:
          - required
    - name: "boot"
      filesystem: ext2
      mountPoint: "/boot"
      size: 500MiB
      minSize: 200MiB
      maxSize: 1GiB
      features:
          - required
    - name: "efi"
      filesystem: vfat  # Required for EFI, even though we removed vfat from available types
      mountPoint: "/boot/efi"
      size: 512MiB
      minSize: 128MiB
      maxSize: 1GiB
      features:
          - boot
          - esp
    # Removed swap partition entirely since default is 'none'

# Available filesystem types (added zfs and btrfs, removed vfat except for EFI)
availableFileSystemTypes: ["ext4", "ext3", "ext2", "btrfs", "xfs", "f2fs", "jfs", "reiserfs", "zfs"]

# ZFS-specific settings (if needed)
zfs:
    pool:
        name: "gentoo-pool"
        features: "all"
    datasets:
        - name: "root"
          mountpoint: "/"
          compression: "lz4"
          atime: "off"
          checksum: "on"
        - name: "home"
          mountpoint: "/home"
          compression: "lz4"
    swap:
        zvol: no  # Since we're disabling swap
