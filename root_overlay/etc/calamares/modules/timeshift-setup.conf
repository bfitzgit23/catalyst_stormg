# timeshift-setup.conf
#
# Calamares 3.4.x shellprocess instance run in the target chroot. It fills the
# installed root filesystem's UUID into /etc/timeshift/timeshift.json (see
# root_overlay/usr/local/bin/stormg-timeshift-setup), so the pre-configured
# Timeshift defaults shipped in the live image are also valid on the disk.
#
# The leading "-" makes a failure non-fatal: Timeshift must never abort an
# installation, and the Calamares log keeps the script's message.
---
dontChroot: false
timeout: 120

script:
    - "-/usr/local/bin/stormg-timeshift-setup"
