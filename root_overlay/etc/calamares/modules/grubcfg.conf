overwrite: true
keepDistributor: true
kernel_params: [ "rw", "nvidia-drm.modeset=1" ]
defaults:
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: true

kernelParams: ["quiet", "crypt_device=UUID=$(blkid -s UUID -o value /dev/sda2)"]