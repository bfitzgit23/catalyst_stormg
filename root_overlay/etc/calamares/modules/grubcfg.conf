# /etc/calamares/modules/grubcfg.conf
#
# Calamares 3.4.x grubcfg (same as 3.3.x) is a Python module and only reads these keys:
#   overwrite, keep_distributor, always_use_defaults, kernel_params, defaults
# (the old C++-module keys like efiBootLoader / grubInstall / efiBootMgr are
# ignored). A "defaults:" with no value crashes the module during install
# with a cryptic Python traceback - the "vague error" this file used to
# produce. Entries inside "defaults" are raw GRUB variable names that are
# written straight into /etc/default/grub on the installed system.
---
overwrite: true
keep_distributor: true
kernel_params: [ "rw", "nvidia-drm.modeset=1" ]

defaults:
  GRUB_TIMEOUT: "10"
