---
# Array of maps for enabling OpenRC services on the installed target system
services:
  - name: "xdm"
    runlevel: "default"
    mandatory: true
  - name: "dbus"
    runlevel: "default"
    mandatory: true
  - name: "NetworkManager"
    runlevel: "default"
    mandatory: false
  - name: "bluetooth"
    runlevel: "default"
    mandatory: false
  # Timeshift's schedule runs from /etc/cron.d/timeshift-hourly; cronie is the
  # virtual/cron default provider pulled in by app-backup/timeshift.
  - name: "cronie"
    runlevel: "default"
    mandatory: false
