---
# Array of maps for enabling OpenRC services on the installed target system
services:
  - name: "xdm"
    runlevel: "default"
    mandatory: true
  - name: "dbus"
    runlevel: "default"
    mandatory: true
  - name: "NetworkManager"
    runlevel: "default"
    mandatory: false
  - name: "bluetooth"
    runlevel: "default"
    mandatory: false
