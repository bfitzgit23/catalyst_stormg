# /etc/calamares/modules/partition.conf
#
# Calamares 3.4.x partition module (schema identical in 3.3.x). Every key here is optional - missing
# keys fall back to built-in defaults - but keep this file valid YAML: a
# parse failure only shows up as a cryptic one-liner in the session log
# and then calamares silently runs with defaults.
#
# If calamares hangs on the "Partitions" step ("loading modules" / a
# spinning wheel), that is the KPMCore disk scan, not this config: the
# partition module probes every block device at startup and waits forever
# for the scan to finish. Run `calamares-debug` (installed on the live
# ISO) to find the exact device that stalls, then unplug or wipe it.
---
# EFI system partition. (Top-level "efiSystemPartition:" is a deprecated
# alias that prints a warning in the session log; the "efi:" block is the
# current spelling and is understood by calamares 3.3.x / 3.4.x.)
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 300MiB
  minimumSize: 32MiB
  label: "EFI"

userSwapChoices:
  - none      # Create no swap, use no swap
  - small     # Up to 4GB
  - suspend   # At least main memory size
  - file      # To swap file instead of partition

drawNestedPartitions: false

alwaysShowPartitionLabels: true

allowManualPartitioning: true

initialPartitioningChoice: none

initialSwapChoice: none

# LUKS containers are created as LUKS1 by default (GRUB cannot unlock
# LUKS2 + Argon2id yet). "luks" is accepted as an alias for "luks1".
luksGeneration: luks1

# When "erase disk" has to create a fresh partition table, use GPT.
defaultPartitionTableType: gpt

defaultFileSystemType: "ext4"

availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

# Live-ISO safety: never tear down the live system's own device-mapper
# targets (the squashfs live-* mounts, the ISO's USB stick, Ventoy) while
# partitioning. Without this the partition step can fail - or hang - trying
# to unmount the very media calamares is running from.
essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
  enable: true
