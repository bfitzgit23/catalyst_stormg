# /etc/calamares/modules/keyboard.conf
#
# Calamares 3.4.x keyboard module (schema identical in 3.3.x). This file used to contain the literal
# text "[FILE_DOES_NOT_EXIST]" (a leftover placeholder), which made
# calamares print a cryptic "failed to parse config" warning in the
# session log and then silently fall back to defaults. All keys below are
# optional; they are spelled out so the behavior is explicit.
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/usr/share/keymaps/xkb"
useLocale1: false
configure:
  kwin: false
  gnome: false
