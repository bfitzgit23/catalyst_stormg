# networkcfg.conf
#
# The networkcfg module in calamares 3.4.x is a Python module that reads NO
# configuration keys - the "internet" / "writeNetworkConfigs" entries this
# file used to carry were silently ignored. The module copies the live
# system's NetworkManager connections, netplan config and resolv.conf into
# the target. The file itself must exist (a missing one makes calamares
# print "No config file for networkcfg"), but its contents are not read.
---
