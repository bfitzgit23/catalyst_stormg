# locale.conf
---
region: "Europe"        # default timezone region (starting point on the map)
zone: "London"          # default timezone zone
localeGenPath: "/etc/locale.gen"
# GeoIP timezone lookup is DISABLED (no geoip: block below).
# NOTE: to enable the lookup, use the "geoip:" submap form. To enable:
# geoip:
#   style: "json"
#   url: "https://geoip.kde.org/v1/calamares"
#   selector: ""
# geoip:
#   style: "json"
#   url: "https://geoip.kde.org/v1/calamares"
#   selector: ""
