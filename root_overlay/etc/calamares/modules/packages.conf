# Gentoo packages configuration
# Uses custom shell commands for emerge
backend: "shell"  # Required for Gentoo (no native Portage backend)

# Shell commands to handle packages
install:
  - "chroot /mnt emerge --quiet-build y --autounmask-continue=y --autounmask-write=y {packages}"

remove:
  - "chroot /mnt emerge --unmerge {packages}"

# Skip these if you want minimal error handling (not recommended)
skip_if_no_internet: false
timeout: 1200  # Emerge can take a long time

operations:
  - install
  - try-remove

# Gentoo packages list (same as before)
packages:
  - sys-apps/openrc
  - sys-kernel/gentoo-kernel-bin
  - sys-boot/grub
  - sys-auth/elogind
  - sys-apps/dbus
  - x11-wm/xfce4-meta
  - net-misc/networkmanager
  - sys-fs/cryptsetup  # For LUKS