# shellprocess-squall.conf
#
# Runs after the displaymanager module: the installer has just rewritten the
# target's lightdm.conf (user-session= from displaymanager.conf) and unpackfs
# has copied the live one in, so make the result deterministic — Squall as the
# default session, and no autologin for the removed live user.
---
script:
    - "/usr/local/bin/stormg-squall-default"
