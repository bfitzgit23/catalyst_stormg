#
# Machine-ID and other random data on the target system.
#
# StormG is an OpenRC system -- there is no systemd to own /etc/machine-id,
# so the "systemd" key MUST stay false. What we still want on the target:
#  - /var/lib/dbus/machine-id (dbus: true) -- D-Bus reads this on OpenRC too
#  - an entropy seed for the first boot (entropy-copy)
#
# The previous config had systemd:true + entropy-files pointing at
# /var/lib/systemd/random-seed, which does not exist on this ISO layout and
# made the module log errors while installing.
---
systemd: false

dbus: true

dbus-symlink: false

entropy-copy: true

entropy-files:
    - /var/lib/urandom/random-seed
