# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# NOTE: This stage was built with the bindist Use flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8
MAKEOPTS="-j12"
ACCEPT_LICENSE="*"
FEATURES="candy parallel-fetch parallel-install getbinpkg"
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3"
USE="ncurses plymouth dbus X -kde -gnome pipewire bluetooth python icu networkmanager branding png jpeg bindist compat -systemd"
INPUT_DEVICES="libinput joystick"
# Every card except nvidia, deliberately: x11-base/xorg-drivers pulls in
# x11-drivers/nvidia-drivers as soon as video_cards_nvidia is set, and that
# ebuild builds kernel modules - in a LiveCD chroot there is no configured
# kernel ("Kernel not configured; no .config found in /usr/src/linux") and the
# ISO ships a prebuilt binary kernel the modules could never match anyway.
# Nouveau + Mesa cover NVIDIA cards on the live ISO.
# ("* -nvidia" is not an option: portage rejects '-' in USE_EXPAND variables.)
VIDEO_CARDS="amdgpu asahi ast d3d12 dummy exynos fbdev freedreno geode i915 i965 imagination intel lavapipe lima mga nouveau nvk omap qxl panfrost panthor r100 r128 r200 r300 r600 radeon radeonsi siliconmotion tegra v3d vc4 vesa via virgl virtualbox vivante vmware zink"
